    description: "The BMW i4 (model code G26) is a battery electric compact executive car produced by BMW since October 2021. It is the brand's first all-electric Gran Coupe, based on a modified version of the CLAR platform used for the 4 Series Gran Coupe. Unlike the bespoke platform of the earlier i3, the i4 represents BMW's new approach of offering electric variants within existing model lines. The production version was revealed in March 2021 and went on sale in November 2021 as a 2022 model year. The exterior design closely resembles the conventional 4 Series Gran Coupe, with distinctive blue accents and aerodynamic enhancements identifying it as an electric model. Models introduced at launch include the high-performance M50 with a dual-motor xDrive all-wheel system and eDrive40 with a single rear motor. The i4 M50 is significant as the first all-electric BMW M-branded vehicle. Additional variants were added over time: eDrive35 (August 2022) with 210 kW, eDrive40 with 250 kW single rear motor producing 335 HP, xDrive40 (May 2023) with dual motors producing 396 HP, and M60 variant with 442 kW announced for 2025. The 70.2 kWh or 83.9 kWh (net capacity) battery provides a range of up to 301 miles for the eDrive40 and 270 miles for the M50 (EPA ratings). Inside, the i4 features BMW's curved display combining a 12.3-inch digital instrument cluster and 14.9-inch infotainment screen running BMW's iDrive 8 system with Apple CarPlay and Android Auto capability. The vehicle supports DC fast charging at up to 205 kW for the 83.9 kWh models (180 kW for the eDrive35), allowing a 10-80% charge in approximately 31 minutes. The i4 has up to 40 driver assistance systems, enabling Level 2 semi-autonomous driving capability. Production takes place at BMW's Munich plant. The i4 represents BMW's strategy to electrify its core lineup while maintaining brand-characteristic driving dynamics and premium features, serving as the electric equivalent to the BMW 3 Series and 4 Series."
